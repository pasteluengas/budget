 <!DOCTYPE html>
<html>
	<head>
		<title>Paste Budget</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<h1>Paste's Personal Budget Manager</h1>
		<span>I'm not stylizing this</span>
		<div class="container">
			<div class="fuck-h">
				<h2><span id="remaining">$0.00 (0%)</span> Remaining</h2>
				<h3>Using <span id="using">$0.00 (0%)</span> from a total of $<span id="total">0.00</span></h3>
				</div>
			<div class="flex-container">
				<div class="bar" id="bar"></div>
				<div class="add">
					<div class="fuck-soan"><span id="span">Add and click</span></div>
					<div class="form-container">
						<h2 id="title">Add Element</h2>
						<div class="form">
							<h1>
							<input type="text" placeholder="Name" id="name">
							<br><input type="number" id="num">
							<select id="method">
								<option value="mon">$</option>
								<option value="per">%</option>
							</select>
							<input type="button" value="Add" onclick="add()">
						</div>
					</div>
				</div>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
